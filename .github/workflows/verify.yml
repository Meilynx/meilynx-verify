name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  self-test-and-fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Self-test (pinned fixture hashes, offline path, signature checks)
        run: python verify-pack.py --self-test
      - name: Verify the shipped fixture chain offline (unsigned, so --allow-unsigned)
        run: python verify-pack.py --records fixtures/records --manifest fixtures/manifest.json --allow-unsigned
      - name: Verify the shipped coverage fixture chain offline (v1.8, v1.13)
        run: python verify-pack.py --records fixtures/coverage/records --manifest fixtures/coverage/manifest.json --allow-unsigned
      - name: An unsigned chain is not a pass without --allow-unsigned (exit 3)
        run: |
          set +e
          python verify-pack.py --records fixtures/records --manifest fixtures/manifest.json
          rc=$?
          if [ "$rc" -ne 3 ]; then
            echo "unsigned chain exited $rc, expected 3" >&2; exit 1
          fi
      - name: A tampered record must fail (exit 1, even with --allow-unsigned)
        run: |
          cp -r fixtures/records /tmp/records
          python - <<'EOF'
          import json
          p = '/tmp/records/00000000000000000001.bin'
          d = json.load(open(p)); d['input_tokens'] += 1
          json.dump(d, open(p, 'w'))
          EOF
          set +e
          python verify-pack.py --records /tmp/records --manifest fixtures/manifest.json --allow-unsigned
          rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "tampered chain exited $rc, expected 1: verifier is broken" >&2; exit 1
          fi
      - name: Edits outside the preimage must fail (v1.12 prompt, v1.12 asserted label, v1.13 key list)
        run: |
          expect_fail() {
            # $1 records dir, $2 manifest, $3 sequence, $4 python edit of record d
            rm -rf /tmp/edited && cp -r "$1" /tmp/edited
            python - "$3" "$4" <<'EOF'
          import json, sys
          p = f'/tmp/edited/{int(sys.argv[1]):020d}.bin'
          d = json.load(open(p)); exec(sys.argv[2]); json.dump(d, open(p, 'w'))
          EOF
            set +e
            python verify-pack.py --records /tmp/edited --manifest "$2" --allow-unsigned
            rc=$?
            set -e
            if [ "$rc" -ne 1 ]; then
              echo "edit '$4' at seq $3 exited $rc, expected 1: verifier is broken" >&2; exit 1
            fi
          }
          expect_fail fixtures/records fixtures/manifest.json 3 \
            "d['messages'][0]['content'] = 'edited after sealing'"
          expect_fail fixtures/records fixtures/manifest.json 4 \
            "d['identity']['asserted']['agent_name'] = 'impostor-agent'"
          expect_fail fixtures/coverage/records fixtures/coverage/manifest.json 1 \
            "d['coverage_key_inventory']['keys_json'] = d['coverage_key_inventory']['keys_json'].replace('\"governed\":false', '\"governed\":true')"
      - name: Chain-head anchors; token verdicts match the proxy verifier and OpenSSL, and each offline pack exits as expected
        run: python fixtures/run-anchor-cases.py
      - name: The anchored sample verifies through the fixture roots (ANCHORS OK)
        run: |
          set -o pipefail
          python verify-pack.py --records fixtures/anchors/packs/fully-anchored/records \
            --manifest fixtures/anchors/packs/fully-anchored/manifest.json --allow-unsigned \
            --tsa-root test-rsa=fixtures/anchors/roots/rsa-root.pem \
            --tsa-root test-ec=fixtures/anchors/roots/ec-root.pem | tee /tmp/anchored.out
          grep -q "ANCHORS OK: chain=chain_tnt_fixture_run_a anchored_through=4 witnesses=2/2" /tmp/anchored.out
      - name: A record changed after it was anchored must fail (exit 1)
        run: |
          set +e
          python verify-pack.py --records fixtures/anchors/packs/tampered-head/records \
            --manifest fixtures/anchors/packs/tampered-head/manifest.json --allow-unsigned \
            --tsa-root test-rsa=fixtures/anchors/roots/rsa-root.pem \
            --tsa-root test-ec=fixtures/anchors/roots/ec-root.pem > /tmp/tampered.out
          rc=$?
          set -e
          grep -q "the record changed after it was anchored" /tmp/tampered.out
          if [ "$rc" -ne 1 ]; then
            echo "tampered anchored head exited $rc, expected 1: verifier is broken" >&2; exit 1
          fi
      - name: The PEM fixture roots are the DER roots the cases reference
        run: |
          for r in rsa ec; do
            openssl x509 -inform der -in fixtures/anchors/roots/$r-root.der | diff - fixtures/anchors/roots/$r-root.pem
          done
      - name: Fixtures were generated from this verifier
        run: |
          python fixtures/generate.py --out /tmp/regen
          diff -r /tmp/regen/records fixtures/records
          diff /tmp/regen/manifest.json fixtures/manifest.json
          diff -r /tmp/regen/coverage fixtures/coverage
      - name: Embedded signature test vectors match their generator
        run: python fixtures/generate-signature-vectors.py --check
      - name: Every tampered signed pack fails with its exit code and reason
        run: python fixtures/run-signature-cases.py

  cosign-cross-check:
    # The same signed-pack cases, each also put to cosign. The two verdicts
    # must agree, except on the cases the runner lists where verify-pack.py
    # is the stricter of the two.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.1.3'
      - name: verify-pack.py and cosign agree
        run: python fixtures/run-signature-cases.py --cosign cosign
